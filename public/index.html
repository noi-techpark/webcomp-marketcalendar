<!-- Example of how you implement a webcomponent in a website -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Mercati in Alto Adige</title>
</head>

<body>

  <webcomp-market-calendar
    title-italian="Mercati in Alto Adige"
    title-english="Markets in Alto Adige"
    title-german="Märkte in Alto Adige"
    source="hds"
    color-presets="OPENDATAHUB"
    language="en"
    filter-zone-default-value=""
    filter-category-default-value=""
    navbar-visibility="true"
    language-visibility="true"
    light-dark-visibility="true"
    zoom-fairs-markets-map="15"
    center-maps-maps="46.50,11.50"
    zoom-maps-maps="9"
    filter="true"
    theme="dark"
    initial-view="fairs"
    page-size="8"
    debug="false">
  </webcomp-market-calendar>
  <script src="webcomp-market-calendar.js"></script>
</body>

</html>
